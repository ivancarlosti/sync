<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sync — monochrome icon mark, used in the application header.
  Strokes use `currentColor`, so the mark inherits the Tailwind text colour and
  therefore follows the admin-selected light/dark theme automatically.
  (BrandLogo.vue inlines this file at build time through Vite's `?raw` import.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 3 20 20" width="24" height="24"
     role="img" aria-label="Sync">
  <g fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8.5H19M15.5 5L19 8.5L15.5 12"/>
    <path d="M20 15.5H5M8.5 12L5 15.5L8.5 19"/>
  </g>
</svg>
