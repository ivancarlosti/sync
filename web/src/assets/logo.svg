<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sync — logo lockup packaged for the SPA bundle (used by About/Brand cards).
  Identical construction to /web/public/logo.svg; kept as a separate asset so a
  future wordmark tweak can be versioned for the app independently of the
  static/public copy that is shared with og:image and release artifacts.
-->
