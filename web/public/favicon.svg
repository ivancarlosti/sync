<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sync — favicon / app icon (icon mark only).
  Uses the brand gradient on light backgrounds and a brighter variant when the
  browser/OS reports a dark colour scheme, so a single file works in both.
  The tight viewBox (2 3 20 20) crops the 24×24 icon grid to its optical bounds.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 3 20 20" width="32" height="32"
     role="img" aria-label="Sync">
  <defs>
    <linearGradient id="syncFaviconLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="syncFaviconDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <style>
    .sync-arrow { stroke: url(#syncFaviconLight); }
    @media (prefers-color-scheme: dark) {
      .sync-arrow { stroke: url(#syncFaviconDark); }
    }
  </style>

  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path class="sync-arrow" d="M4 8.5H19M15.5 5L19 8.5L15.5 12"/>
    <path class="sync-arrow" d="M20 15.5H5M8.5 12L5 15.5L8.5 19"/>
  </g>
</svg>
